services:
  palworld-server:
    image: "${PALWORLD_IMAGE:-ghcr.io/pocketpairjp/palserver:v1.0.2.101103}"
    container_name: palworld-server
    restart: unless-stopped
    stop_grace_period: 120s
    entrypoint: /pal/helper.sh
    command:
      - "-port=${PALWORLD_PORT:-8211}"
      - "-players=${MAX_PLAYERS:-8}"
      - "-useperfthreads"
      - "-NoAsyncLoadingThread"
      - "-UseMultithreadForDS"
    ports:
      - "${PALWORLD_PORT:-8211}:${PALWORLD_PORT:-8211}/udp"
      # Management API is reachable only from this Windows PC.
      - "127.0.0.1:${PALWORLD_REST_PORT:-8212}:8212/tcp"
    volumes:
      - ./docker/helper.sh:/pal/helper.sh:ro
      - ./data/Saved:/pal/Package/Pal/Saved
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
