name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare local configuration
        shell: pwsh
        run: ./scripts/setup-project.ps1 -SkipDockerValidation

      - name: Validate repository
        shell: pwsh
        run: ./scripts/test-project.ps1

      - name: Test a clean first-time setup
        shell: pwsh
        run: ./tests/test-clean-checkout.ps1

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0

      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester ./tests/Project.Tests.ps1 -CI
