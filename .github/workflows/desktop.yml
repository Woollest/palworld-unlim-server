name: Desktop EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build PalOps installer
        shell: pwsh
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis
      - name: Upload PalOps app and installer
        uses: actions/upload-artifact@v4
        with:
          name: palops-windows-x64
          path: |
            desktop/src-tauri/target/release/palops.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
