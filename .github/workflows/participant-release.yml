name: Participant Client Release

on:
  push:
    tags:
      - "participant-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Validate participant client version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.Replace('participant-v', '')
          [xml]$project = Get-Content participant-client/src/PalworldUnlimClient.csproj -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match client version $projectVersion."
          }

      - name: Run repository tests
        shell: pwsh
        run: ./scripts/test-project.ps1

      - name: Build standalone Windows client
        shell: pwsh
        run: |
          dotnet publish participant-client/src/PalworldUnlimClient.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist/participant-client

      - name: Package participant client
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Replace('participant-v', '')
          $archive = "dist/Palworld-Unlim-Client-$version-win-x64.zip"
          Compress-Archive `
            -LiteralPath dist/participant-client/PalworldUnlimClient.exe,participant-client/README.md `
            -DestinationPath $archive `
            -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  $([IO.Path]::GetFileName($archive))" -Encoding ascii

      - name: Create participant client release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Replace('participant-v', '')
          gh release create '${{ github.ref_name }}' `
            "dist/Palworld-Unlim-Client-$version-win-x64.zip" `
            "dist/Palworld-Unlim-Client-$version-win-x64.zip.sha256" `
            --verify-tag `
            --title "Palworld Unlim Client v$version" `
            --notes "参加者向けUnlim CLI接続アプリの一時配布版です。ZIPを展開し、PalworldUnlimClient.exeを起動してください。"
