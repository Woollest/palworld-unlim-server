name: Participant App Release

on:
  push:
    tags:
      - "participant-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.Replace('participant-v', '')
          [xml]$project = Get-Content participant-app/PalworldJoin.csproj -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match app version $projectVersion."
          }

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/test-project.ps1

      - name: Build standalone Windows app
        shell: pwsh
        run: |
          dotnet publish participant-app/PalworldJoin.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist/PalworldJoin

      - name: Verify observed Unlim port mapping
        shell: pwsh
        run: ./dist/PalworldJoin/PalworldJoin.exe --self-test

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Replace('participant-v', '')
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler was not installed.' }
          & $compiler "/DMyAppVersion=$version" participant-app/installer/PalworldJoin.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $installer = "dist/installer/Palworld-Join-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Installer was not generated.' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $([IO.Path]::GetFileName($installer))" -Encoding ascii

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Replace('participant-v', '')
          gh release create '${{ github.ref_name }}' `
            "dist/installer/Palworld-Join-Setup-$version.exe" `
            "dist/installer/Palworld-Join-Setup-$version.exe.sha256" `
            --verify-tag `
            --title "Palworld Join v$version" `
            --notes "参加者向け正式版です。接続キーを入力すると、Unlimの導入・更新とPalworld接続先の検出を行います。コード署名はないためSmartScreen警告が表示される場合があります。"
