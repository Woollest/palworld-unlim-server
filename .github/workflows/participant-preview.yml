name: Participant App Preview

on:
  push:
    tags:
      - "participant-preview-v*.*.*"

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Validate preview version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.Replace('participant-preview-v', '')
          [xml]$project = Get-Content participant-app/PalworldJoin.csproj -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match app version $projectVersion."
          }

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/test-project.ps1

      - name: Build standalone Windows preview
        shell: pwsh
        run: |
          dotnet publish participant-app/PalworldJoin.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist/PalworldJoin

      - name: Verify observed Unlim port mapping
        shell: pwsh
        run: ./dist/PalworldJoin/PalworldJoin.exe --self-test

      - name: Package preview
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Replace('participant-preview-v', '')
          $archive = "dist/Palworld-Join-PREVIEW-$version-win-x64.zip"
          Compress-Archive `
            -LiteralPath dist/PalworldJoin/PalworldJoin.exe,participant-app/README.md `
            -DestinationPath $archive `
            -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" `
            -Value "$hash  $([IO.Path]::GetFileName($archive))" `
            -Encoding ascii

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Replace('participant-preview-v', '')
          gh release create '${{ github.ref_name }}' `
            "dist/Palworld-Join-PREVIEW-$version-win-x64.zip" `
            "dist/Palworld-Join-PREVIEW-$version-win-x64.zip.sha256" `
            --verify-tag `
            --prerelease `
            --title "Palworld Join PREVIEW v$version" `
            --notes "未導入PCと実サーバーでの動作確認専用です。正式配布しないでください。"
