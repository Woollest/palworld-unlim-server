name: Bug report
description: Report a reproducible problem with the server automation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach tokens, passwords, Unlim keys, world saves or unredacted logs.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PalOps version, Windows version, Docker Desktop version and whether the EXE or browser recovery view was used.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, connection keys, channel IDs and personal data.
          required: true
